name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/openapi/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci
          npm run api:tools

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build y comprobación de secretos en dist/
        run: npm run build

      - name: Tipos de la API coherentes con el contrato
        run: npm run api:check

      - name: Validar specs de OpenSpec
        run: |
          npm install -g @fission-ai/openspec@1.16.0
          openspec validate --all --strict

      - name: Detector de diseño (impeccable)
        run: sh .claude/skills/impeccable/scripts/impeccable detect --github src/

  imagen:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build --platform linux/amd64 -t verifactu-web:ci .

      - name: Prueba de humo contra el contrato
        run: bash scripts/comprobar-imagen.sh verifactu-web:ci
